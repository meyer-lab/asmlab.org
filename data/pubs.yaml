  - abstract: High-grade serous ovarian carcinoma (HGSOC), the most prevalent
        and lethal form of epithelial ovarian cancer, frequently recurs with
        chemotherapy resistance and limited treatment options. While
        previous studies have examined molecular changes following
        treatment, the mechanisms of disease progression remain incomplete.
        To address this, we conducted longitudinal analysis of matched
        chemonaive, post-neoadjuvant chemotherapy, and recurrent HGSOCs
        using bulk and single-cell RNA sequencing with histology to track
        tumor evolution. Findings reveal progressive enrichment of
        neuroendocrine features resembling small cell neuroendocrine (SCN)
        carcinoma and RB1-deficiency in recurrent tumors, mirroring
        therapy-escape mechanisms documented in lung and prostate cancers.
        In vivo models support that repeated chemotherapy promotes SCN
        transitions. Furthermore, serous tubal intraepithelial carcinoma
        precursor lesions and pre-treatment tumors harboring SCN features
        indicate that this transformation commences early in HGSOC
        development. This study establishes SCN transition as a feature of
        HGSOC progression, links it to RB1 loss and immune dysfunction, and
        identifies therapeutic avenues for recurrent disease.
