        (LT) limits understanding of relationships between immunological
        signatures, time, and recipient/donor health factors in LT. In
        this exploratory study, we collected cytokine and liver function
        test (LFT) measurements from LT donors and recipients at
        multiple pre- and post-operative timepoints. We developed a
        tensor-based factorization method to reduce these measurements
        to four components that manifested across cytokines, LFTs, and
        time. These components associated pre-operative immune
        signatures with immune signatures up to a month post-operation.
        Integration of allograft survival into this factorization
        reduced these four components to two associated with five-year
        allograft survival. These signatures suggested that pronounced
        CD4+ polarization associated with impaired growth factor
        expression and increased allograft loss risk. Donor and
        recipient age modulated this CD4+ polarization. These findings
        provide insights into the immunological signatures of LT,
        identifying potential therapeutic avenues for future validation.
